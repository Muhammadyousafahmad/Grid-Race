<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f0e4" />
    <meta name="description" content="Grid Race — a fast abstract strategy race game. Race to the opposite edge, block with walls, outsmart the CPU." />
    <title>Grid Race</title>

    <style>
      @font-face {
        font-family: 'Space Grotesk';
        src: url('/fonts/space-grotesk-latin.woff2') format('woff2');
        font-style: normal;
        font-weight: 500 700;
        font-display: swap;
      }

      @font-face {
        font-family: 'DM Sans';
        src: url('/fonts/dm-sans-latin.woff2') format('woff2');
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        accent-color: var(--theme-accent, #315ea8);
        --theme-bg: #f4f0e4;
        --theme-accent: #315ea8;
        --theme-selection-text: #f4f0e4;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        background-color: var(--theme-bg);
      }

      body {
        font-family: 'DM Sans', sans-serif;
        background-color: var(--theme-bg);
        /* Honour notches / rounded display corners */
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }

      /* Phaser expands the viewport while keeping the route board square. */
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #game-container canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      ::selection {
        color: var(--theme-selection-text);
        background: var(--theme-accent);
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
